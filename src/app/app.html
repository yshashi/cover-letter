<div class="min-h-screen bg-stone-50 dark:bg-stone-950">
  <app-header />
  <app-notification />

  <main class="px-4 py-6 mx-auto sm:px-6 lg:px-8 lg:py-8">
    <!-- Mobile-only Edit/Preview tabs -->
    <div
      class="flex p-1 mb-6 bg-white rounded-lg border border-stone-200 lg:hidden dark:bg-stone-800 dark:border-stone-700">
      <button type="button" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors"
        [class]="mobileView() === 'edit' ? 'bg-accent-600 text-white' : 'text-stone-600 dark:text-stone-300'"
        (click)="mobileView.set('edit')">
        Edit
      </button>
      <button type="button" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors"
        [class]="mobileView() === 'preview' ? 'bg-accent-600 text-white' : 'text-stone-600 dark:text-stone-300'"
        (click)="mobileView.set('preview')">
        Preview
      </button>
    </div>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-6">
      <div class="space-y-8 lg:col-span-2" [class]="mobileView() === 'edit' ? 'block' : 'hidden lg:block'">
        <div class="card">
          <app-personal-info-editor />
        </div>

        <div class="card">
          <app-profile-manager />
        </div>

        <div class="card">
          <app-template-selector />
        </div>

        <div class="card">
          <app-form-editor />
        </div>
      </div>

      <div class="lg:sticky lg:top-8 lg:self-start lg:col-span-4"
        [class]="mobileView() === 'preview' ? 'block' : 'hidden lg:block'">
        <div class="card">
          <app-preview />
        </div>
      </div>
    </div>
  </main>

  <footer class="py-6 mt-12 border-t border-stone-200 dark:border-stone-800">
    <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
      <p class="text-sm font-medium text-center text-stone-500 dark:text-stone-400">
        Cover Letter Generator - Create professional cover letters instantly
      </p>
    </div>
  </footer>
</div>
