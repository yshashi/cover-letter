<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover Letter Generator</title>
  <meta name="description" content="Create professional cover letters instantly with our easy-to-use generator" />
  <meta name="theme-color" content="#e56f2f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#3d160b" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="application-name" content="Cover Letter Generator" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cover Letter Generator" />
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fallback system fonts if CDN fails -->
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Inter'), local('Inter-Regular'), local('Segoe UI'), local('Helvetica');
    }

    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Roboto'), local('Roboto-Regular'), local('Arial'), local('Helvetica');
    }
  </style>
  <!-- Try loading from CDN with fallback -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet"
    onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@fontsource/inter/index.css';" />
</head>

<body class="font-['Inter'] antialiased">
  <app-root>
    <div class="flex justify-center items-center min-h-screen bg-stone-50 dark:bg-stone-950">
      <div
        class="p-8 text-center rounded-xl border border-stone-200 shadow-md bg-white dark:bg-stone-800 dark:border-stone-700">
        <div class="relative mx-auto mb-6 w-16 h-16">
          <div class="absolute inset-0 rounded-full border-4 border-transparent animate-spin border-t-accent-600"></div>
          <div class="absolute inset-[30%] rounded-full bg-white dark:bg-stone-900"></div>
        </div>
        <p class="font-medium text-stone-700 dark:text-stone-300">Loading Cover Letter Generator...</p>
      </div>
    </div>
  </app-root>
</body>

</html>
